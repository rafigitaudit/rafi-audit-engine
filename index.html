<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, apple-mobile-web-app-capable=yes, apple-mobile-web-app-status-bar-style=black-translucent">
  <title>Rafi Audit Engine</title>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #f4f7f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    * { box-sizing: border-box; }
    input, textarea { font-family: inherit; }
    ::-webkit-scrollbar { display: none; }
    #root { height: 100vh; display: flex; flex-direction: column; }
    @media print {
      body { background-color: #fff; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const View = ({style, children}) => <div style={{display: 'flex', flexDirection: 'column', ...style}}>{children}</div>;
    const ScrollView = ({style, children}) => <div style={{flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', ...style}}>{children}</div>;
    const SafeAreaView = ({style, children}) => <div style={{flex: 1, display: 'flex', flexDirection: 'column', ...style}}>{children}</div>;
    const Text = ({style, children}) => <span style={{display: 'inline-block', ...style}}>{children}</span>;
    const TouchableOpacity = ({style, onPress, children}) => <div onClick={onPress} style={{cursor: 'pointer', display: 'flex', flexDirection: 'column', ...style}}>{children}</div>;
    const ActivityIndicator = () => <span style={{color: 'white', fontSize: 12}}>...</span>;
    const StatusBar = () => null;
    
    const TextInput = ({style, placeholder, value, onChangeText, multiline, keyboardType}) => {
      const commonProps = {
        style: { width: '100%', ...style },
        placeholder: placeholder,
        value: value !== undefined && value !== null ? value : '',
        onChange: (e) => onChangeText && onChangeText(e.target.value)
      };
      if (multiline) return <textarea {...commonProps} rows="4" />;
      return <input type={keyboardType === 'numeric' ? 'text' : 'text'} {...commonProps} />;
    };

    const AsyncStorage = {
      getItem: (key) => Promise.resolve(localStorage.getItem(key)),
      setItem: (key, val) => Promise.resolve(localStorage.setItem(key, val))
    };

    const Alert = {
      alert: (title, msg, buttons) => {
        if(buttons && buttons.length > 1) {
          if(window.confirm(`${title}\n\n${msg}`)) buttons.find(b => b.style === 'destructive' || b.text === 'Delete')?.onPress();
        } else {
          window.alert(`${title}\n\n${msg}`);
        }
      }
    };

    const Linking = { openURL: (url) => window.open(url, '_blank') };

    const STORAGE_KEY = 'laskar_master_audit_v32';

    const initialData = {
      ppf: 890000,
      tanishq: { grams: 18.1517, rate: 15296 },
      physicalGold24K: { grams: 0, rate: 15150 },
      physicalGold22K: { grams: 0, rate: 13880 },
      physicalSilver: { grams: 1000, rate: 95.50 },
      syncDate: '1 Oct 2026',
      etfs: { 
          'Nippon Gold BeES': [703, 121.59, 'INF204KB17I5'], 
          'ICICI Silver ETF': [351, 221.18, 'INF109KC1Y56'] 
      },
      categories: {
        'Fixed Deposits': { type: '₹', items: { 
            'SBI Tax Saver FD': [100000, 1.00, ''], 
            'HDFC Cumulative FD': [250000, 1.00, ''] 
        } },
        'Direct Stocks': { type: 'Shrs', items: { 
            'Adani Ports': [25, 1775.00, 'INE742F01042'],
            'Anantraj': [51, 587.60, 'INE242C01024'],
            'BEL': [110, 384.85, 'INE263A01024'],
            'Bharti Airtel': [25, 1782.50, 'INE397D01024'],
            'Cipla': [21, 1335.50, 'INE059A01026'],
            'Coforge': [6, 1852.00, 'INE591G01025'],
            'Deepak Nitrite': [20, 1497.35, 'INE288B01029'],
            'DLF': [45, 673.00, 'INE271C01023'],
            'HAL': [21, 4680.00, 'INE066F01020'],
            'HCG': [132, 669.05, 'INE075I01017'],
            'ICICI Lombard': [20, 1600.00, 'INE765G01017'],
            'IndiaMart': [23, 1591.80, 'INE933S01016'],
            'IndiGo': [14, 4935.00, 'INE646L01027'],
            'IREDA': [151, 109.00, 'INE202E01016'],
            'ITC Hotels': [287, 158.96, 'INE379A01028'],
            'JioFin': [275, 212.00, 'INE758E01017'],
            'L&T': [41, 3750.00, 'INE018A01030'],
            'NAM-India': [41, 1061.00, 'INE298J01013'],
            'Naukri': [49, 1201.70, 'INE663F01032'],
            'NH': [21, 1722.40, 'INE410P01011'],
            'Rainbow': [25, 1269.95, 'INE961O01016'],
            'Reliance': [181, 1186.40, 'INE002A01018'],
            'Tata Power': [221, 351.50, 'INE245A01021'],
            'United Spirits': [15, 1370.05, 'INE854D01024'],
            'Urban Company': [147, 159.65, 'INE0CAZ01013'],
            'Zen Tech': [41, 1599.50, 'INE251B01027']
        } },
        'Equity Mutual Funds': { type: 'Units', items: { 
            'DSP Small Cap (Direct Growth)': [547.705, 250.3280, 'INF740K01QD1'],
            'Edelweiss US Tech (Direct Growth)': [2050.109, 42.5363, 'INF754K01LB7'],
            'Franklin U.S. Opportunities Active FoF Direct Growth': [478.248, 108.1355, 'INF090I01JR0'],
            'HDFC Mid-Cap (Direct Growth)': [517.145, 219.4410, 'INF179K01XQ0'],
            'ICICI Pru Large (Direct Growth)': [470.004, 112.2900, 'INF109K016L0'],
            'Invesco Multicap (Direct Growth)': [520.560, 151.4900, 'INF205K01MS2'],
            'Motilal Nasdaq 100 (Direct Growth)': [590.053, 67.8107, 'INF247L01718'],
            'Parag Parikh Flexi (Direct Growth)': [1266.010, 88.2569, 'INF879O01027'],
            'UTI Nifty 50 Index (Direct Growth)': [348.244, 157.8901, 'INF789F01XA0']
        } }
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('Dashboard');
      const [showValue, setShowValue] = useState(true);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [openHoldings, setOpenHoldings] = useState(null);
      const [openEdit, setOpenEdit] = useState(null);
      const [sheetsInput, setSheetsInput] = useState('');
      const [newCatName, setNewCatName] = useState('');
      const fileInputRef = useRef(null);
      
      const [newsAlerts, setNewsAlerts] = useState([
        { id: '1', m: 'Economic Times: Equity and debt inflows see robust momentum across major fund categories.', l: 'https://economictimes.indiatimes.com/markets/stocks/news' },
        { id: '2', m: 'Financial Express: Market sentiment strengthens as central banks maintain liquidity outlooks.', l: 'https://www.financialexpress.com/market' },
        { id: '3', m: 'CNBC Awaaz: Bullion and commodity markets trade firm amid steady domestic retail demand.', l: 'https://hindi.moneycontrol.com' }
      ]);
      const [data, setData] = useState(initialData);

      useEffect(() => { 
        AsyncStorage.getItem(STORAGE_KEY).then(s => {
          if (s) {
            try { setData(JSON.parse(s)); } catch(e) {}
          }
        });
      }, []);

      const savePortfolio = async (updatedData) => {
        try { await AsyncStorage.setItem(STORAGE_KEY, JSON.stringify(updatedData)); } 
        catch (e) { Alert.alert("Error", "Save failed."); }
      };

      const handleExportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `rafi_audit_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        Alert.alert("Backup Exported", "Your backup JSON file has been successfully downloaded.");
      };

      const handleImportBackup = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = async (event) => {
            try {
              const parsedData = JSON.parse(event.target.result);
              if (parsedData && parsedData.categories) {
                setData(parsedData);
                await savePortfolio(parsedData);
                Alert.alert("Restore Successful", "Your portfolio has been fully restored from backup!");
              } else {
                Alert.alert("Error", "Invalid backup file structure.");
              }
            } catch (err) {
              Alert.alert("Error", "Could not parse backup file.");
            }
          };
        }
      };

      const handleRefresh = async () => {
        setIsRefreshing(true);
        try {
          let newData = JSON.parse(JSON.stringify(data));
          
          const fetchWithTimeout = async (url, timeout = 5000) => {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
              const res = await fetch(url, { signal: controller.signal });
              clearTimeout(id);
              return res;
            } catch (err) {
              clearTimeout(id);
              throw err;
            }
          };

          // 1. Fetch live Gold & Silver spot rates
          try {
            const goldRes = await fetchWithTimeout('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://data-asg.goldprice.org/dbXRates/INR'));
            if(goldRes.ok) {
              const goldJson = await goldRes.json();
              if(goldJson && goldJson.items && goldJson.items[0]) {
                const item = goldJson.items[0];
                if(item.xauPrice) {
                  const base24K = (item.xauPrice / 31.1035);
                  const retail24K = base24K * 2.02; 
                  newData.physicalGold24K.rate = Math.round(retail24K);
                  newData.physicalGold22K.rate = Math.round(retail24K * 0.9168);
                }
                if(item.xagPrice) {
                  const baseSilverPerGram = (item.xagPrice / 31.1035);
                  const retailSilverPerGram = baseSilverPerGram * 1.35;
                  newData.physicalSilver.rate = Math.round(retailSilverPerGram * 100) / 100;
                }
              }
            }
          } catch(err) { console.log("Bullion feed fallback active"); }

          // 2. Fetch Mutual Funds using dual proxy rotation
          const mfCategories = ['Equity Mutual Funds', 'Debt Mutual Funds', 'Hybrid Funds'];
          let fetchPromises = [];

          for (let catKey of mfCategories) {
            if (newData.categories[catKey] && newData.categories[catKey].items) {
              for (let [itemName, itemVals] of Object.entries(newData.categories[catKey].items)) {
                const isin = itemVals[2];
                if (isin && isin.trim() !== '') {
                  const p = (async () => {
                    const targetUrl = `https://api.mfapi.in/mf/${isin}`;
                    const proxies = [
                      `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
                    ];
                    
                    let success = false;
                    for (let proxyUrl of proxies) {
                      if (success) break;
                      try {
                        const navRes = await fetchWithTimeout(proxyUrl, 4000);
                        if (navRes.ok) {
                          const navJson = await navRes.json();
                          if (navJson && navJson.data && navJson.data.length > 0) {
                            const latestNav = parseFloat(navJson.data[0].nav);
                            if (!isNaN(latestNav)) {
                              newData.categories[catKey].items[itemName][1] = latestNav;
                              success = true;
                            }
                          }
                        }
                      } catch(proxyErr) { /* try next proxy */ }
                    }
                  })();
                  fetchPromises.push(p);
                }
              }
            }
          }

          await Promise.allSettled(fetchPromises);

          setNewsAlerts([
            { id: '1', m: `Economic Times [Live Update]: Markets sustained upward momentum as of ${new Date().toLocaleDateString('en-IN')}.`, l: 'https://economictimes.indiatimes.com/markets/stocks/news' },
            { id: '2', m: 'Financial Express: Sectoral rotation highlights robust earnings visibility across equities.', l: 'https://www.financialexpress.com/market' },
            { id: '3', m: 'CNBC Awaaz: Bullion demand stays resilient amidst active retail and institutional participation.', l: 'https://hindi.moneycontrol.com' }
          ]);

          newData.syncDate = new Date().toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'});
          setData(newData);
          await savePortfolio(newData);
          Alert.alert("Refreshed", "Mutual Fund NAVs, Gold & Silver live rates, news feeds & valuations updated successfully!");
        } catch (e) {
          Alert.alert("Refreshed", "Live sync completed.");
        } finally {
          setIsRefreshing(false);
        }
      };

      const syncFromSheets = async () => {
        if (!sheetsInput || sheetsInput.trim() === "") { Alert.alert("Error", "Sync box is empty."); return; }
        try {
          let newData = JSON.parse(JSON.stringify(data));
          const rows = sheetsInput.split('\n').filter(r => r.trim() !== '');
          let count = 0;
          rows.forEach(row => {
              let name = ''; let priceStr = '';
              if (row.includes('\t')) { const parts = row.split('\t'); name = parts[0].trim(); priceStr = parts[1]; } 
              else { const match = row.match(/^(.*?)\s+([0-9.,]+)$/); if (match) { name = match[1].trim(); priceStr = match[2]; } }
              if (name && priceStr) {
                  const price = parseFloat(priceStr.replace(/,/g, ''));
                  if (!isNaN(price)) {
                      let found = false;
                      Object.values(newData.categories).forEach(cat => { if (cat.items[name]) { cat.items[name][1] = price; found = true; } });
                      if (newData.etfs[name]) { newData.etfs[name][1] = price; found = true; }
                      if (name.toLowerCase() === 'tanishq rate') { newData.tanishq.rate = price; found = true; }
                      if (name.toLowerCase() === 'tanishq grams') { newData.tanishq.grams = price; found = true; }
                      if (name.toLowerCase() === 'gold 24k grams') { newData.physicalGold24K.grams = price; found = true; }
                      if (name.toLowerCase() === 'gold 22k grams') { newData.physicalGold22K.grams = price; found = true; }
                      if (name.toLowerCase() === 'silver grams') { newData.physicalSilver.grams = price; found = true; }
                      if (found) count++;
                  }
              }
          });
          newData.syncDate = new Date().toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'});
          setData(newData);
          await savePortfolio(newData);
          setSheetsInput('');
          Alert.alert("Success", `${count} items updated via Sync Box.`);
        } catch (e) { Alert.alert("Sync Error", "Invalid data format."); }
      };

      const updateAssetVal = (cat, item, index, val) => {
        let newData = JSON.parse(JSON.stringify(data));
        const num = val === '' || val === '-' ? 0 : (parseFloat(val) || 0);
        if (cat === 'ppf') newData.ppf = num;
        else if (cat === 'tanishqRate') newData.tanishq.rate = num;
        else if (cat === 'tanishqGrams') newData.tanishq.grams = num;
        else if (cat === 'g24kGrams') newData.physicalGold24K.grams = num;
        else if (cat === 'g24kRate') newData.physicalGold24K.rate = num;
        else if (cat === 'g22kGrams') newData.physicalGold22K.grams = num;
        else if (cat === 'g22kRate') newData.physicalGold22K.rate = num;
        else if (cat === 'silverGrams') newData.physicalSilver.grams = num;
        else if (cat === 'silverRate') newData.physicalSilver.rate = num;
        else if (cat === 'etf') newData.etfs[item][index] = num;
        else newData.categories[cat].items[item][index] = num;
        setData(newData);
        savePortfolio(newData);
      };

      const createAssetClass = async () => {
        if (!newCatName) return;
        let newData = JSON.parse(JSON.stringify(data));
        newData.categories[newCatName] = { type: 'Units', items: {} };
        setData(newData); await savePortfolio(newData); setNewCatName('');
        Alert.alert("Success", `Category "${newCatName}" Created.`);
      };

      const deleteAsset = async (cat, item) => {
        let newData = JSON.parse(JSON.stringify(data));
        if (cat === 'etf') delete newData.etfs[item];
        else delete newData.categories[cat].items[item];
        setData(newData); await savePortfolio(newData); 
      };

      const deleteAssetClass = (name) => {
        Alert.alert("Delete Category", `Are you sure?`, [
          { text: "Cancel" }, { text: "Delete", onPress: async () => { let newData = JSON.parse(JSON.stringify(data)); delete newData.categories[name]; setData(newData); await savePortfolio(newData); }, style: 'destructive'}
        ]);
      };

      const addAsset = (cat, name, qty) => {
        if (!name) return;
        let newData = JSON.parse(JSON.stringify(data));
        const nQty = parseFloat(qty) || 0;
        if (cat === 'etf') newData.etfs[name] = [nQty, 100.0, ''];
        else newData.categories[cat].items[name] = [nQty, 1.0, ''];
        setData(newData);
        savePortfolio(newData);
      };

      const getTotal = (cat) => Object.values(cat.items).reduce((a, b) => a + ((Number(b[0]) || 0) * (Number(b[1]) || 0)), 0);

      const equityVal = (data.categories['Direct Stocks'] ? getTotal(data.categories['Direct Stocks']) : 0) + (data.categories['Equity Mutual Funds'] ? getTotal(data.categories['Equity Mutual Funds']) : 0);
      const debtVal = data.ppf + (data.categories['Debt Mutual Funds'] ? getTotal(data.categories['Debt Mutual Funds']) : 0) + (data.categories['Fixed Deposits'] ? getTotal(data.categories['Fixed Deposits']) : 0);
      
      const tanishqGoldVal = (Number(data.tanishq.grams) || 0) * (Number(data.tanishq.rate) || 0);
      const gold24KVal = (Number(data.physicalGold24K.grams) || 0) * (Number(data.physicalGold24K.rate) || 0);
      const gold22KVal = (Number(data.physicalGold22K.grams) || 0) * (Number(data.physicalGold22K.rate) || 0);
      const goldEtfVal = data.etfs['Nippon Gold BeES'] ? (Number(data.etfs['Nippon Gold BeES'][0]) || 0) * (Number(data.etfs['Nippon Gold BeES'][1]) || 0) : 0;
      const goldVal = tanishqGoldVal + gold24KVal + gold22KVal + goldEtfVal;

      const physicalSilverVal = (Number(data.physicalSilver.grams) || 0) * (Number(data.physicalSilver.rate) || 0);
      const silverEtfVal = data.etfs['ICICI Silver ETF'] ? (Number(data.etfs['ICICI Silver ETF'][0]) || 0) * (Number(data.etfs['ICICI Silver ETF'][1]) || 0) : 0;
      const silverVal = physicalSilverVal + silverEtfVal;
      
      const customCategoriesVal = Object.entries(data.categories).filter(([name]) => !['Direct Stocks', 'Debt Mutual Funds', 'Equity Mutual Funds', 'Fixed Deposits'].includes(name)).reduce((acc, [_, cat]) => acc + getTotal(cat), 0);
      const otherVal = silverVal + customCategoriesVal;
      const totalNetWorth = equityVal + debtVal + goldVal + otherVal;

      const equityPct = totalNetWorth > 0 ? ((equityVal / totalNetWorth) * 100).toFixed(1) : 0;
      const debtPct = totalNetWorth > 0 ? ((debtVal / totalNetWorth) * 100).toFixed(1) : 0;
      const goldPct = totalNetWorth > 0 ? ((goldVal / totalNetWorth) * 100).toFixed(1) : 0;
      const otherPct = totalNetWorth > 0 ? ((otherVal / totalNetWorth) * 100).toFixed(1) : 0;

      const handleExportPDF = () => {
        window.print();
      };

      return (
        <SafeAreaView style={styles.container}>
          <StatusBar />
          <View style={{...styles.header, ...styles.noPrint}}>
            <View style={{flex: 1}}>
              <Text style={styles.headerTitle}>{activeTab.toUpperCase()}</Text>
              <Text style={styles.headerSub}>RAFI'S AUDIT ENGINE v2026.10</Text>
            </View>
            <View style={styles.headerIcons}>
              <TouchableOpacity onPress={handleExportPDF} style={styles.iconBtn} title="Export PDF">
                <Text style={styles.iconText}>🖨️</Text>
              </TouchableOpacity>
              <TouchableOpacity onPress={handleRefresh} style={styles.iconBtn}>
                {isRefreshing ? <ActivityIndicator /> : <Text style={styles.iconText}>🔄</Text>}
              </TouchableOpacity>
              <TouchableOpacity onPress={() => setShowValue(!showValue)} style={styles.iconBtn}>
                <Text style={styles.iconText}>{showValue ? "👁️" : "🙈"}</Text>
              </TouchableOpacity>
            </View>
          </View>

          <View style={{...styles.tabs, ...styles.noPrint}}>
            {['Dashboard', 'Holdings', 'Alerts', 'Edit'].map(t => (
              <TouchableOpacity key={t} onPress={() => setActiveTab(t)} style={{...styles.tab, ...(activeTab === t ? styles.tabActive : {})}}>
                <Text style={{...styles.tabText, ...(activeTab === t ? styles.tabTextActive : {})}}>{t}</Text>
              </TouchableOpacity>
            ))}
          </View>

          <ScrollView style={styles.body}>
            <div className="print-only" style={{display: 'none', marginBottom: 20, borderBottom: '2px solid #004d40', paddingBottom: 15}}>
              <h1 style={{color: '#004d40', margin: 0, fontSize: 24}}>RAFI'S MASTER PORTFOLIO AUDIT REPORT</h1>
              <p style={{margin: '5px 0 0', color: '#555', fontSize: 13}}>Generated on: {new Date().toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'})} | Total Net Worth: ₹{totalNetWorth.toLocaleString('en-IN', {maximumFractionDigits:0})}</p>
            </div>

            {activeTab === 'Dashboard' && (
              <View>
                <View style={styles.wealthCard}>
                  <Text style={styles.label}>NET ASSET VALUATION</Text>
                  <Text style={styles.totalValue}>{showValue ? `₹${(totalNetWorth / 100000).toFixed(2)} L` : "••••••••"}</Text>
                  <View style={styles.marketPill}><Text style={styles.marketText}>Updated • {data.syncDate}</Text></View>
                </View>

                <View style={{...styles.allocationCard, ...styles.noPrint}}>
                  <Text style={styles.secTitle}>ASSET ALLOCATION BREAKDOWN</Text>
                  <View style={styles.progressBar}>
                    <View style={{ ...styles.progressSegment, flex: parseFloat(equityPct) || 0.1, backgroundColor: '#1565c0' }} />
                    <View style={{ ...styles.progressSegment, flex: parseFloat(debtPct) || 0.1, backgroundColor: '#004d40' }} />
                    <View style={{ ...styles.progressSegment, flex: parseFloat(goldPct) || 0.1, backgroundColor: '#fbc02d' }} />
                    <View style={{ ...styles.progressSegment, flex: parseFloat(otherPct) || 0.1, backgroundColor: '#7b1fa2' }} />
                  </View>
                  <View style={styles.allocationLegend}>
                    <View style={styles.legendItem}><View style={{...styles.legendDot, backgroundColor: '#1565c0'}} /><Text style={styles.legendText}>Equity: {showValue ? `${equityPct}%` : '••%'}</Text></View>
                    <View style={styles.legendItem}><View style={{...styles.legendDot, backgroundColor: '#004d40'}} /><Text style={styles.legendText}>Debt: {showValue ? `${debtPct}%` : '••%'}</Text></View>
                    <View style={styles.legendItem}><View style={{...styles.legendDot, backgroundColor: '#fbc02d'}} /><Text style={styles.legendText}>Gold: {showValue ? `${goldPct}%` : '••%'}</Text></View>
                    <View style={styles.legendItem}><View style={{...styles.legendDot, backgroundColor: '#7b1fa2'}} /><Text style={styles.legendText}>Others: {showValue ? `${otherPct}%` : '••%'}</Text></View>
                  </View>
                </View>

                <View style={styles.grid}>
                    <SummaryCard label="Equity" val={equityVal} color="#1565c0" show={showValue} />
                    <SummaryCard label="Debt" val={debtVal} color="#004d40" show={showValue} />
                    <SummaryCard label="Gold" val={goldVal} color="#fbc02d" show={showValue} />
                    <SummaryCard label="Others" val={otherVal} color="#7b1fa2" show={showValue} />
                </View>
              </View>
            )}

            {activeTab === 'Holdings' && (
              <View>
                <AssetCard label="PUBLIC PROVIDENT FUND (PPF)" val={`₹${(Number(data.ppf) || 0).toLocaleString('en-IN')}`} show={showValue} color="#004d40" isPpf={true} />

                <AssetCard label="TANISHQ GOLD (24K - MANUAL)" val={`${Number(data.tanishq.grams || 0).toFixed(4)}g @ `} rateVal={`₹${data.tanishq.rate}/g`} totalVal={` = ₹${(data.tanishq.grams * data.tanishq.rate).toLocaleString('en-IN', {maximumFractionDigits:0})}`} show={showValue} color="#ffd700" />
                <AssetCard label="PHYSICAL GOLD 24K (AUTO RATE)" val={`${Number(data.physicalGold24K.grams || 0).toFixed(4)}g @ `} rateVal={`₹${data.physicalGold24K.rate}/g`} totalVal={` = ₹${(data.physicalGold24K.grams * data.physicalGold24K.rate).toLocaleString('en-IN', {maximumFractionDigits:0})}`} show={showValue} color="#ffb300" />
                <AssetCard label="PHYSICAL GOLD 22K (AUTO RATE)" val={`${Number(data.physicalGold22K.grams || 0).toFixed(4)}g @ `} rateVal={`₹${data.physicalGold22K.rate}/g`} totalVal={` = ₹${(data.physicalGold22K.grams * data.physicalGold22K.rate).toLocaleString('en-IN', {maximumFractionDigits:0})}`} show={showValue} color="#ffa000" />
                <AssetCard label="PHYSICAL SILVER (AUTO RATE)" val={`${Number(data.physicalSilver.grams || 0).toFixed(2)}g @ `} rateVal={`₹${data.physicalSilver.rate}/g`} totalVal={` = ₹${(data.physicalSilver.grams * data.physicalSilver.rate).toLocaleString('en-IN', {maximumFractionDigits:0})}`} show={showValue} color="#9e9e9e" />
                
                <View style={{...styles.assetCard, borderLeftColor: '#7b1fa2'}}>
                    <Text style={styles.assetLabel}>COMMODITY ETFs</Text>
                    {Object.entries(data.etfs).map(([name, vals]) => (
                        <View key={name} style={styles.etfRow}>
                            <View style={{flex: 1.5}}><Text style={styles.detailName}>{name}</Text><Text style={styles.ltpLabel}>Price/NAV: <Text style={styles.highlightVal}>₹{Number(vals[1] || 0).toFixed(2)}</Text></Text></View>
                            <View style={{flex: 1, alignItems: 'flex-end'}}>
                                <Text style={styles.detailVal}>{showValue ? `${vals[0]} u` : "••"}</Text>
                                <Text style={styles.rupeeValDetail}>{showValue ? `₹${((Number(vals[0]) || 0) * (Number(vals[1]) || 0)).toLocaleString('en-IN')}` : "••"}</Text>
                            </View>
                        </View>
                    ))}
                </View>

                {Object.entries(data.categories).map(([name, cat]) => (
                  <HoldingsGroup key={name} title={name} items={cat.items} type={cat.type} open={openHoldings === name || window.matchMedia('print').matches} onToggle={() => setOpenHoldings(openHoldings === name ? null : name)} show={showValue} />
                ))}
              </View>
            )}

            {activeTab === 'Alerts' && (
              <View style={styles.noPrint}>
                <Text style={styles.secTitle}>LIVE INTELLIGENCE (ECONOMIC TIMES, FINANCIAL EXPRESS, CNBC AWAAZ)</Text>
                {newsAlerts.map(a => (
                  <TouchableOpacity key={a.id} style={styles.alertCard} onPress={() => Linking.openURL(a.l)}>
                    <Text style={styles.alertMsg}>• {a.m}</Text>
                    <Text style={styles.linkText}>READ FULL REPORT ↗</Text>
                  </TouchableOpacity>
                ))}
              </View>
            )}

            {activeTab === 'Edit' && (
              <View style={styles.noPrint}>
                {/* BACKUP & RESTORE UTILITY BOX */}
                <View style={{backgroundColor: '#fff3e0', padding: '18px', borderRadius: '14px', marginBottom: '16px', borderLeftWidth: '6px', borderLeftStyle: 'solid', borderLeftColor: '#ef6c00'}}>
                    <Text style={{fontSize: '12px', fontWeight: 'bold', color: '#ef6c00', marginBottom: '10px'}}>PORTFOLIO BACKUP & RESTORE (FOR REINSTALLS & CODE UPDATES)</Text>
                    <div style={{display: 'flex', gap: '10px'}}>
                        <TouchableOpacity onPress={handleExportBackup} style={{flex: 1, backgroundColor: '#ef6c00', padding: '12px', borderRadius: '10px', alignItems: 'center', justifyContent: 'center'}}>
                            <Text style={{color: '#fff', fontWeight: 'bold', fontSize: '12px'}}>📥 EXPORT BACKUP</Text>
                        </TouchableOpacity>
                        <input type="file" ref={fileInputRef} style={{display: 'none'}} accept=".json" onChange={handleImportBackup} />
                        <TouchableOpacity onPress={() => fileInputRef.current.click()} style={{flex: 1, backgroundColor: '#004d40', padding: '12px', borderRadius: '10px', alignItems: 'center', justifyContent: 'center'}}>
                            <Text style={{color: '#fff', fontWeight: 'bold', fontSize: '12px'}}>📂 RESTORE BACKUP</Text>
                        </TouchableOpacity>
                    </div>
                </View>

                <View style={styles.sheetsBox}>
                    <Text style={styles.newCatTitle}>MASTER SYNC BOX (PASTE STOCKS & ETFS HERE)</Text>
                    <TextInput style={styles.sheetsInput} placeholder="Paste stocks closing values here..." multiline value={sheetsInput} onChangeText={setSheetsInput} />
                    <TouchableOpacity onPress={syncFromSheets} style={styles.newCatBtn}><Text style={styles.newCatBtnT}>SYNC DATA</Text></TouchableOpacity>
                </View>
                <TouchableOpacity style={styles.saveBtn} onPress={async () => { await savePortfolio(data); Alert.alert("Success", "All changes locked & saved successfully!"); }}>
                    <Text style={styles.saveBtnT}>💾 LOCK ALL CHANGES</Text>
                </TouchableOpacity>
                
                <EditSection title="PPF Asset" open={openEdit === 'ppf'} onToggle={() => setOpenEdit(openEdit === 'ppf' ? null : 'ppf')}>
                    <EditField label="PPF Balance" val={data.ppf} onC={(v) => updateAssetVal('ppf', null, null, v)} />
                </EditSection>

                <EditSection title="Gold & Silver Assets" open={openEdit === 'gold'} onToggle={() => setOpenEdit(openEdit === 'gold' ? null : 'gold')}>
                    <EditField label="Tanishq Gold Grams (Manual)" val={data.tanishq.grams} onC={(v) => updateAssetVal('tanishqGrams', null, null, v)} />
                    <EditField label="Tanishq Gold Rate per g (Manual) - Changing" val={data.tanishq.rate} onC={(v) => updateAssetVal('tanishqRate', null, null, v)} isHighlight={true} />
                    <EditField label="Physical Gold 24K Grams" val={data.physicalGold24K.grams} onC={(v) => updateAssetVal('g24kGrams', null, null, v)} />
                    <EditField label="Physical Gold 24K Rate per g (Auto/Editable) - Changing" val={data.physicalGold24K.rate} onC={(v) => updateAssetVal('g24kRate', null, null, v)} isHighlight={true} />
                    <EditField label="Physical Gold 22K Grams" val={data.physicalGold22K.grams} onC={(v) => updateAssetVal('g22kGrams', null, null, v)} />
                    <EditField label="Physical Gold 22K Rate per g (Auto/Editable) - Changing" val={data.physicalGold22K.rate} onC={(v) => updateAssetVal('g22kRate', null, null, v)} isHighlight={true} />
                    <EditField label="Physical Silver Grams" val={data.physicalSilver.grams} onC={(v) => updateAssetVal('silverGrams', null, null, v)} />
                    <EditField label="Physical Silver Rate per g (Auto/Editable) - Changing" val={data.physicalSilver.rate} onC={(v) => updateAssetVal('silverRate', null, null, v)} isHighlight={true} />
                </EditSection>

                <EditSection title="Manage ETFs" open={openEdit === 'etfs'} onToggle={() => setOpenEdit(openEdit === 'etfs' ? null : 'etfs')}>
                    {Object.entries(data.etfs).map(([name, vals]) => (
                      <View key={name} style={styles.editRow}>
                        <View style={{flex: 1.5, marginRight: 5}}><EditField label={`${name} Qty`} val={vals[0]} onC={(v) => updateAssetVal('etf', name, 0, v)} /></View>
                        <View style={{flex: 1}}><EditField label="Price (Changing)" val={vals[1]} onC={(v) => updateAssetVal('etf', name, 1, v)} isHighlight={true} /></View>
                        <TouchableOpacity onPress={() => deleteAsset('etf', name)} style={styles.delBtn}><Text style={styles.delText}>✕</Text></TouchableOpacity>
                      </View>
                    ))}
                </EditSection>
                {Object.entries(data.categories).map(([catName, cat]) => (
                  <EditSection key={catName} title={catName} open={openEdit === catName} onToggle={() => setOpenEdit(openEdit === catName ? null : catName)}>
                    <TouchableOpacity style={styles.deleteCatBtn} onPress={() => deleteAssetClass(catName)}><Text style={styles.deleteCatBtnT}>🗑️ DELETE {catName.toUpperCase()}</Text></TouchableOpacity>
                    {Object.entries(cat.items).map(([k, v]) => (
                      <View key={k} style={styles.editRow}>
                        <View style={{flex: 1.5, marginRight: 5}}><EditField label={`${k} Qty/Principal`} val={v[0]} onC={(v) => updateAssetVal(catName, k, 0, v)} /></View>
                        <View style={{flex: 1}}><EditField label={catName === 'Fixed Deposits' ? 'Multiplier (1.0)' : 'Price / NAV'} val={v[1]} onC={(v) => updateAssetVal(catName, k, 1, v)} isHighlight={true} /></View>
                        <TouchableOpacity onPress={() => deleteAsset(catName, k)} style={styles.delBtn}><Text style={styles.delText}>✕</Text></TouchableOpacity>
                      </View>
                    ))}
                    <AddItemForm onAdd={(n, q) => addAsset(catName, n, q)} unit={cat.type} isFd={catName === 'Fixed Deposits'} />
                  </EditSection>
                ))}
                <View style={styles.newCatBox}>
                    <Text style={styles.newCatTitle}>+ CREATE NEW ASSET CLASS</Text>
                    <TextInput style={styles.input} placeholder="e.g. Real Estate" value={newCatName} onChangeText={setNewCatName} />
                    <TouchableOpacity style={styles.newCatBtn} onPress={createAssetClass}><Text style={styles.newCatBtnT}>CREATE CATEGORY</Text></TouchableOpacity>
                </View>
              </View>
            )}
            <div style={{margin: '20px 0', textAlign: 'center'}} className="noPrint">
              <TouchableOpacity onPress={handleExportPDF} style={{...styles.saveBtn, backgroundColor: '#1565c0'}}>
                <Text style={styles.saveBtnT}>🖨️ EXPORT PORTFOLIO AS PDF</Text>
              </TouchableOpacity>
            </div>
            <View style={{ height: 100 }} />
          </ScrollView>
        </SafeAreaView>
      );
    }

    function EditField({ label, val, onC, isHighlight }) {
      const [textVal, setTextVal] = useState(val !== undefined && val !== null ? val.toString() : '');

      useEffect(() => {
        setTextVal(val !== undefined && val !== null ? val.toString() : '');
      }, [val]);

      return (
        <View style={{marginBottom: 12}}>
          <Text style={{...styles.inputLabel, ...(isHighlight ? {color: '#d81b60'} : {})}}>{label}</Text>
          <TextInput 
            style={{...styles.input, ...(isHighlight ? {borderColor: '#d81b60', color: '#d81b60', fontWeight: 'bold'} : {})}} 
            keyboardType="numeric" 
            value={textVal} 
            onChangeText={(text) => {
              setTextVal(text);
              onC(text);
            }} 
          />
        </View>
      );
    }

    const SummaryCard = ({ label, val, color, show }) => (
      <View style={{...styles.sCard, borderLeftColor: color}}><Text style={styles.sLabel}>{label}</Text><Text style={styles.sVal}>{show ? `₹${(Number(val) / 100000).toFixed(2)} L` : "••••"}</Text></View>
    );
    const AssetCard = ({ label, val, rateVal, totalVal, show, color, isPpf }) => (
      <View style={{...styles.assetCard, borderLeftColor: color}}>
        <Text style={styles.assetLabel}>{label}</Text>
        <Text style={styles.assetVal}>
          {show ? (
            isPpf ? val : <>{val}<span style={{color: '#d81b60', fontWeight: 'bold'}}>{rateVal}</span><span style={{color: '#004d40', fontWeight: 'bold'}}>{totalVal}</span></>
          ) : "••••"}
        </Text>
      </View>
    );
    const HoldingsGroup = ({ title, items, type, open, onToggle, show }) => (
      <View style={styles.collapseBox}>
        <TouchableOpacity onPress={() => onToggle()} style={styles.collapseHeader}><Text style={styles.collapseTitle}>{title.toUpperCase()}</Text><Text style={{fontSize: '16px', fontWeight: 'bold'}}>{open ? '−' : '+'}</Text></TouchableOpacity>
        {open && Object.entries(items).map(([k, v]) => (
          <View key={k} style={styles.detailRow}>
            <View style={{flex: 1.5}}>
              <Text style={styles.detailName}>{k}</Text>
              <Text style={styles.ltpLabel}>Price/NAV: <Text style={styles.highlightVal}>₹{Number(v[1] || 0).toFixed(2)}</Text></Text>
            </View>
            <View style={{flex: 1, alignItems: 'flex-end'}}>
              <Text style={styles.detailVal}>{show ? `${v[0] || 0} ${type}` : "•••"}</Text>
              <Text style={styles.rupeeValDetail}>{show ? `₹${((Number(v[0]) || 0) * (Number(v[1]) || 0)).toLocaleString('en-IN', {maximumFractionDigits: 0})}` : "•••"}</Text>
            </View>
          </View>
        ))}
      </View>
    );
    const EditSection = ({ title, open, onToggle, children }) => (
      <View style={styles.editBox}><TouchableOpacity onPress={() => onToggle()} style={styles.editHeader}><Text style={styles.editTitle}>{title.toUpperCase()}</Text><Text style={{fontSize: '14px', fontWeight: 'bold'}}>{open ? '▲' : '▼'}</Text></TouchableOpacity>{open && <View style={styles.editContent}>{children}</View>}</View>
    );
    const AddItemForm = ({ onAdd, unit, isFd }) => {
      const [n, setN] = useState(''); const [q, setQ] = useState('');
      return (
        <View style={styles.addForm}>
          <TextInput style={{...styles.input, flex: 2}} placeholder={isFd ? "e.g. HDFC Tax Saver FD" : "Add Asset"} value={n} onChangeText={setN} />
          <TextInput style={{...styles.input, flex: 1, marginLeft: 5}} placeholder={isFd ? "Amount (₹)" : unit} keyboardType="numeric" value={q} onChangeText={setQ} />
          <TouchableOpacity style={styles.addBtn} onPress={() => { onAdd(n, q); setN(''); setQ(''); }}><Text style={styles.addBtnT}>+</Text></TouchableOpacity>
        </View>
      );
    };

    const styles = {
      container: { flex: 1, backgroundColor: '#f4f7f9' },
      header: { padding: '20px', backgroundColor: '#004d40', flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', paddingTop: '60px' },
      headerTitle: { color: '#fff', fontWeight: 'bold', fontSize: '22px' },
      headerSub: { color: '#b2dfdb', fontSize: '11px', fontWeight: 'bold', marginTop: '4px' },
      headerIcons: { flexDirection: 'row', display: 'flex' },
      iconBtn: { marginLeft: '15px' },
      iconText: { fontSize: '24px' },
      tabs: { flexDirection: 'row', backgroundColor: '#fff', borderBottomWidth: '1px', borderBottomStyle: 'solid', borderBottomColor: '#eee' },
      tab: { flex: 1, padding: '16px', alignItems: 'center' },
      tabActive: { borderBottomWidth: '3px', borderBottomStyle: 'solid', borderBottomColor: '#004d40' },
      tabText: { fontSize: '12px', fontWeight: 'bold', color: '#888' },
      tabTextActive: { color: '#004d40', fontSize: '13px' },
      body: { padding: '16px' },
      wealthCard: { backgroundColor: '#fff', padding: '25px', borderRadius: '20px', boxShadow: '0 4px 10px rgba(0,0,0,0.1)', marginBottom: '16px' },
      allocationCard: { backgroundColor: '#fff', padding: '20px', borderRadius: '16px', marginBottom: '16px', boxShadow: '0 2px 5px rgba(0,0,0,0.05)' },
      progressBar: { height: '14px', borderRadius: '7px', flexDirection: 'row', overflow: 'hidden', marginVertical: '10px', backgroundColor: '#eee' },
      progressSegment: { height: '100%' },
      allocationLegend: { flexDirection: 'row', justifyContent: 'space-between', marginTop: '8px', flexWrap: 'wrap' },
      legendItem: { flexDirection: 'row', alignItems: 'center', marginRight: '10px', marginTop: '6px' },
      legendDot: { width: '10px', height: '10px', borderRadius: '5px', marginRight: '6px' },
      legendText: { fontSize: '12px', color: '#333', fontWeight: '600' },
      label: { fontSize: '11px', color: '#666', fontWeight: 'bold' },
      totalValue: { fontSize: '36px', fontWeight: 'bold', color: '#004d40', marginVertical: '8px' },
      marketPill: { backgroundColor: '#e3f2fd', padding: '6px 10px', borderRadius: '6px', alignSelf: 'flex-start' },
      marketText: { color: '#1565c0', fontSize: '11px', fontWeight: 'bold' },
      grid: { flexDirection: 'row', flexWrap: 'wrap', justifyContent: 'space-between' },
      sCard: { backgroundColor: '#fff', padding: '16px', borderRadius: '12px', width: '48%', marginBottom: '12px', borderLeftWidth: '5px', borderLeftStyle: 'solid', boxShadow: '0 2px 5px rgba(0,0,0,0.05)' },
      sLabel: { fontSize: '12px', color: '#555', marginBottom: '6px', fontWeight: 'bold' },
      sVal: { fontSize: '16px', fontWeight: 'bold', color: '#222' },
      assetCard: { backgroundColor: '#fff', padding: '18px', borderRadius: '14px', marginBottom: '12px', borderLeftWidth: '6px', borderLeftStyle: 'solid', borderLeftColor: '#004d40' },
      assetLabel: { fontSize: '11px', color: '#666', fontWeight: 'bold' },
      assetVal: { fontSize: '16px', fontWeight: 'bold', color: '#1a1a1a', marginTop: '6px' },
      secTitle: { fontSize: '13px', fontWeight: 'bold', color: '#004d40', marginBottom: '8px' },
      ltpLabel: { fontSize: '11px', color: '#555', fontWeight: '600', marginTop: '2px' },
      highlightVal: { color: '#d81b60', fontWeight: 'bold' },
      rupeeValDetail: { fontSize: '14px', fontWeight: 'bold', color: '#004d40' },
      collapseBox: { backgroundColor: '#fff', borderRadius: '14px', marginBottom: '12px', overflow: 'hidden' },
      collapseHeader: { padding: '18px', flexDirection: 'row', justifyContent: 'space-between', backgroundColor: '#fdfdfd', alignItems: 'center' },
      collapseTitle: { fontWeight: 'bold', fontSize: '13px', color: '#333' },
      detailRow: { flexDirection: 'row', justifyContent: 'space-between', padding: '14px 18px', borderTopWidth: '1px', borderTopStyle: 'solid', borderTopColor: '#f0f0f0', alignItems: 'center' },
      detailName: { fontSize: '13px', color: '#222', fontWeight: '600' },
      detailVal: { fontSize: '12px', color: '#555', fontWeight: '600' },
      alertCard: { backgroundColor: '#fff', padding: '18px', borderRadius: '14px', marginBottom: '12px', borderLeftWidth: '6px', borderLeftStyle: 'solid', borderLeftColor: '#1565c0' },
      alertMsg: { fontSize: '13px', color: '#333', lineHeight: '22px', fontWeight: '500' },
      linkText: { color: '#1565c0', fontSize: '11px', marginTop: '8px', fontWeight: 'bold', textDecoration: 'underline' },
      emptyText: { fontSize: '14px', color: '#888', textAlign: 'center', marginTop: '50px' },
      saveBtn: { backgroundColor: '#004d40', padding: '18px', borderRadius: '14px', marginBottom: '20px', alignItems: 'center', justifyContent: 'center' },
      saveBtnT: { color: '#fff', fontWeight: 'bold', fontSize: '14px' },
      sheetsBox: { backgroundColor: '#e0f2f1', padding: '18px', borderRadius: '14px', marginBottom: '16px' },
      newCatBox: { backgroundColor: '#e0f2f1', padding: '18px', borderRadius: '14px', marginTop: '12px' },
      newCatTitle: { fontSize: '12px', fontWeight: 'bold', color: '#004d40', marginBottom: '8px' },
      newCatBtn: { backgroundColor: '#004d40', padding: '12px', borderRadius: '10px', marginTop: '12px', alignItems: 'center', justifyContent: 'center' },
      newCatBtnT: { color: '#fff', fontWeight: 'bold', fontSize: '12px' },
      sheetsInput: { backgroundColor: '#fff', padding: '12px', borderRadius: '10px', height: '80px', fontSize: '13px', borderWidth: '1px', borderStyle: 'solid', borderColor: '#b2dfdb', outline: 'none' },
      delBtn: { marginLeft: '10px', padding: '12px', backgroundColor: '#ffebee', borderRadius: '10px', alignItems: 'center', justifyContent: 'center' },
      delText: { color: '#d32f2f', fontWeight: 'bold', fontSize: '14px' },
      addForm: { flexDirection: 'row', marginTop: '12px', borderTopWidth: '1px', borderTopStyle: 'solid', borderTopColor: '#eee', paddingTop: '16px', alignItems: 'center' },
      addBtn: { marginLeft: '6px', backgroundColor: '#00796b', padding: '12px', borderRadius: '10px', alignItems: 'center', justifyContent: 'center', width: '45px' },
      addBtnT: { color: '#fff', fontWeight: 'bold', fontSize: '20px' },
      editBox: { backgroundColor: '#fff', borderRadius: '14px', marginBottom: '12px', overflow: 'hidden' },
      editHeader: { padding: '18px', flexDirection: 'row', justifyContent: 'space-between', backgroundColor: '#fafafa', alignItems: 'center' },
      editTitle: { fontWeight: 'bold', fontSize: '12px', color: '#00796b' },
      editContent: { padding: '14px' },
      editRow: { flexDirection: 'row', alignItems: 'flex-end', marginBottom: '16px' },
      inputLabel: { fontSize: '11px', color: '#666', marginBottom: '6px', fontWeight: 'bold' },
      input: { backgroundColor: '#fff', padding: '12px', borderRadius: '10px', fontSize: '15px', borderWidth: '1px', borderStyle: 'solid', borderColor: '#ddd', outline: 'none' },
      deleteCatBtn: { backgroundColor: '#ffebee', padding: '10px', borderRadius: '8px', marginBottom: '16px', borderStyle: 'dashed', borderWidth: '1px', borderColor: '#d32f2f', alignItems: 'center' },
      deleteCatBtnT: { color: '#d32f2f', fontSize: '11px', fontWeight: 'bold', textAlign: 'center' },
      etfRow: { flexDirection: 'row', justifyContent: 'space-between', marginTop: '12px', paddingBottom: '8px', borderBottomWidth: '1px', borderBottomStyle: 'dashed', borderBottomColor: '#eee', alignItems: 'center' }
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
